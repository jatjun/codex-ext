name: Learning Garden · checks and Pages

on:
  push:
    branches: [main, codex/math-adventure-v1]
    paths:
      [
        "math-adventure/**",
        "chinese-adventure/**",
        "learning-home/**",
        ".github/workflows/math-adventure.yml",
      ]
  pull_request:
    paths:
      [
        "math-adventure/**",
        "chinese-adventure/**",
        "learning-home/**",
        ".github/workflows/math-adventure.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: math-adventure-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: math-adventure

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            math-adventure/package-lock.json
            chinese-adventure/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e -- --workers=2
      - name: Check and build Chinese Adventure
        working-directory: chinese-adventure
        run: |
          npm ci
          npm test
          npm run build
          npm run test:e2e -- --workers=2
      - name: Assemble shared home and both subjects
        working-directory: .
        run: |
          mkdir -p learning-site/math-adventure learning-site/chinese-adventure
          cp -R math-adventure/dist/. learning-site/
          cp -R math-adventure/dist/. learning-site/math-adventure/
          cp -R chinese-adventure/dist/. learning-site/chinese-adventure/
          cp learning-home/index.html learning-site/index.html
          touch learning-site/.nojekyll
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: math-adventure-browser-results
          path: |
            math-adventure/test-results/
            chinese-adventure/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: learning-site
  deploy:
    if: github.event_name != 'pull_request' && vars.MATH_ADVENTURE_PAGES_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy Learning Garden
        id: deployment
        uses: actions/deploy-pages@v4
